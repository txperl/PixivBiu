name: CI

# Quality gate for the Go backend, React frontend, and Electron desktop shell.
# Runs on pushes to master and every pull request; tags use release workflows.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so only the latest commit is checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go, ${{ matrix.os }})
    # Windows is in the matrix because the platform_windows.go shims carry real
    # logic (port-busy classification, console pause, reexec) that a Linux-only
    # run never compiles, let alone executes — a broken WSAEADDRINUSE check
    # once shipped precisely because of that gap.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # single source of truth for the Go version
          # setup-go@v5 caches the build and module cache automatically.

      # gofmt output is platform-independent; run it once on Linux (the step
      # is a bash script anyway).
      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The committed internal/web/dist/.gitkeep lets the go:embed in
      # internal/web compile without a frontend build (the frontend job
      # exercises the real build separately).
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # Fast compile-only gate for platforms without a runner in the matrix:
      # darwin shares platform_unix.go with linux but its release cross-build
      # would otherwise only be exercised at tag time. windows/amd64 vet also
      # gives PRs a red light in seconds without waiting on the Windows runner.
      - name: Cross-compile check
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      # Reachability-aware vulnerability scan. Unlike Dependabot's
      # dependency-graph alerts, govulncheck does call-graph analysis and
      # only fails on vulnerabilities that are actually reachable from this
      # binary. The tool is version-pinned via the go.mod `tool` directive;
      # the vulnerability database is fetched from vuln.go.dev at run time.
      # Findings are platform-independent, so once on Linux is enough.
      - name: Vulnerability scan (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        run: go tool govulncheck ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # postinstall compiles the Paraglide i18n messages that tsc/vite need.
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bunx @biomejs/biome ci .

      # `bun run build` is `paraglide:compile && tsc -b && vite build`, so this
      # type-checks (tsc) and bundles in one pass — no separate tsc step needed.
      - name: Type check and build
        run: bun run build

  desktop:
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test contracts
        run: npm run check
