name: Desktop

# The desktop release train — independent from the core `v*` train.
#
# The core (Go binary + embedded SPA) ships on its own cadence via release.yml
# (`v*` → GoReleaser → GitHub Releases). The desktop app is a thin Electron
# shell that BUNDLES a pinned, already-released core binary; it versions and
# ships on its own cadence here, so a shell-only change never forces a core
# release (and vice-versa — no "phantom" updates on either side).
#
# Desktop releases publish to a DEDICATED artifacts-only repository
# (see DESKTOP_REPO below) with plain vX.Y.Z tags. electron-updater's GitHub
# provider needs the newest release in the repo it watches to be a desktop one —
# in this repo the core's v* releases would shadow them, so the two trains keep
# separate repos. The flow is draft-then-publish: a draft release is created
# up front, the three OS runners upload into it, and it flips live only once
# every installer and update artifact is present and internally consistent — so
# updaters and the README's /releases/latest link never see a half-built release.
#
# Cut a desktop release by pushing a `desktop-v*` tag (source stays here):
#   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#
# The core version this build bundles is pinned in desktop/.core-version. Bump
# that file (+ cut a new desktop-v* tag) to ship a newer core to desktop users.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read # this repo: only downloads the pinned core release archive

env:
  # The artifacts-only repository desktop releases publish into. Must match the
  # publish block in desktop/electron-builder.yml (which is what app-update.yml —
  # the updater's baked-in feed — is generated from). A fork changes both.
  DESKTOP_REPO: txperl/PixivBiu-Desktop

jobs:
  # Pre-create the draft release the matrix uploads into. electron-builder can
  # create drafts itself, but three concurrent runners racing that path is a
  # known duplicate-draft hazard; one idempotent create up front removes it.
  draft:
    name: Create draft release
    environment: Public-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create draft release in the desktop repo
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          # Validates strict stable/alpha/beta Desktop SemVer before any release
          # state is created. Unsupported channels (including rc) fail here.
          TITLE="$(node scripts/desktop-release.mjs title "$GITHUB_REF_NAME")"
          if existing_is_draft="$(gh release view "v${VERSION}" --repo "$DESKTOP_REPO" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing_is_draft" != "true" ]; then
              echo "::error::release v${VERSION} is already published; refusing to modify it" >&2
              exit 1
            fi
            echo "release v${VERSION} already exists in ${DESKTOP_REPO}; reusing it"
            exit 0
          fi
          gh release create "v${VERSION}" --repo "$DESKTOP_REPO" --draft \
            --title "$TITLE" \
            --notes "Release assets are being assembled and verified. This draft was triggered by [\`${GITHUB_REF_NAME}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME})."

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: draft
    environment: Public-Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # node + npm drive the Electron build / electron-builder. No Go or Bun:
      # this train never rebuilds the core or the SPA — it downloads the core
      # release the `v*` train already published.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read pinned core version
        shell: bash
        run: echo "CORE_VERSION=$(tr -d '[:space:]' < desktop/.core-version)" >> "$GITHUB_ENV"

      # Download the pinned core release's host-platform archive(s) and stage the
      # binary per-arch into desktop/resources/<arch> (electron-builder embeds the
      # matching slice via extraResources). This is the SAME binary CLI users run —
      # no rebuild, no drift. The shared script auto-detects the platform and, on
      # macOS, stages both the x64 and arm64 slices for the per-arch split. Fails
      # loudly if the release is missing. Uses the default GITHUB_TOKEN — the core
      # lives in THIS repo; only the publish steps below touch DESKTOP_REPO.
      - name: Download & stage the pinned core binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_REPO: ${{ github.repository }}
        run: bash scripts/stage-core.sh "$CORE_VERSION" desktop/resources

      # electron-updater compares the app's package.json version against the feed.
      # Pin it to the desktop tag (drop the leading `desktop-v`) so updates resolve.
      - name: Sync desktop version to the tag
        shell: bash
        run: cd desktop && npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"

      - name: Install desktop deps
        # npm ci (not install): clean, lockfile-exact, faster in CI. The version
        # bump above updates package-lock.json too, so the two stay in sync.
        run: cd desktop && npm ci

      # Compile main/preload, then package for the host platform (macOS builds
      # both arches: dmg+zip for x64 and arm64) and publish the artifacts +
      # update metadata (latest*.yml) into the draft release created above
      # (publish.repo/releaseType in electron-builder.yml). Each runner uploads
      # only its own platform's files, so the parallel matrix never collides.
      # macOS signs + notarizes; Windows signs via Azure Trusted Signing when
      # provisioned (falls back to unsigned otherwise); Linux is unsigned.
      - name: Build & publish into the draft release
        shell: bash
        env:
          # Write access to DESKTOP_REPO (fine-grained PAT, Contents: R/W on that
          # repo only). The default GITHUB_TOKEN can't write to another repo.
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          # macOS Developer ID cert (.p12) + notarization credentials. Keep
          # these empty on Windows: electron-builder otherwise treats the Apple
          # certificate as a generic CSC_LINK and attempts Authenticode signing.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows Azure Trusted Signing. Non-secret account config as repo vars;
          # the service-principal auth as secrets. Signing is skipped (build stays
          # unsigned) unless WIN_AZURE_ENDPOINT is set — provisioning is external
          # and takes ~days, so this stays inert until then.
          WIN_AZURE_ENDPOINT: ${{ vars.WIN_AZURE_ENDPOINT }}
          WIN_AZURE_PUBLISHER_NAME: ${{ vars.WIN_AZURE_PUBLISHER_NAME }}
          WIN_AZURE_ACCOUNT: ${{ vars.WIN_AZURE_ACCOUNT }}
          WIN_AZURE_CERT_PROFILE: ${{ vars.WIN_AZURE_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cd desktop
          npm run build
          # `always` publishes even though this is a tag build (electron-builder
          # only auto-publishes on tag pushes of the SAME repo layout it expects);
          # the release stays a draft until the publish job below flips it live.
          args=(--publish always)
          # Inject Azure Trusted Signing only on Windows and only when provisioned.
          if [ "${RUNNER_OS:-}" = "Windows" ] && [ -n "${WIN_AZURE_ENDPOINT:-}" ]; then
            # publisherName is a top-level win option; only endpoint/account/profile
            # belong under azureSignOptions (any extra key there is forwarded
            # verbatim to Invoke-TrustedSigning and would fail as an unknown param).
            args+=(
              -c.win.publisherName="${WIN_AZURE_PUBLISHER_NAME}"
              -c.win.azureSignOptions.endpoint="${WIN_AZURE_ENDPOINT}"
              -c.win.azureSignOptions.codeSigningAccountName="${WIN_AZURE_ACCOUNT}"
              -c.win.azureSignOptions.certificateProfileName="${WIN_AZURE_CERT_PROFILE}"
            )
          fi
          npx electron-builder "${args[@]}"

  # Flip the draft live only after every platform uploaded all expected assets,
  # the updater metadata references those exact filenames, and the user-facing
  # release notes have been rendered from the verified manifest.
  publish:
    name: Publish release
    needs: desktop
    environment: Public-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read pinned core version
        shell: bash
        run: echo "CORE_VERSION=$(tr -d '[:space:]' < desktop/.core-version)" >> "$GITHUB_ENV"

      - name: Verify completeness & publish
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          metadata="$work/metadata"
          mkdir -p "$metadata"

          is_draft="$(gh release view "v${VERSION}" --repo "$DESKTOP_REPO" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::release v${VERSION} is already published; refusing to modify it" >&2
            exit 1
          fi
          gh release view "v${VERSION}" --repo "$DESKTOP_REPO" --json assets \
            --jq '[.assets[].name]' > "$work/assets.json"
          gh release download "v${VERSION}" --repo "$DESKTOP_REPO" \
            --pattern 'latest*.yml' --dir "$metadata"

          node scripts/desktop-release.mjs verify \
            "$GITHUB_REF_NAME" "$CORE_VERSION" "$GITHUB_REPOSITORY" "$DESKTOP_REPO" \
            "$work/assets.json" "$metadata" "$work/release-notes.md"
          TITLE="$(node scripts/desktop-release.mjs title "$GITHUB_REF_NAME")"

          # A prerelease desktop tag (desktop-v1.2.0-beta.1) must not become the
          # repo's "latest" — /releases/latest keeps pointing at the last stable
          # while updaters on the beta channel still see the prerelease.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "v${VERSION}" --repo "$DESKTOP_REPO" \
              --title "$TITLE" --notes-file "$work/release-notes.md" \
              --draft=false --prerelease
          else
            gh release edit "v${VERSION}" --repo "$DESKTOP_REPO" \
              --title "$TITLE" --notes-file "$work/release-notes.md" \
              --draft=false --prerelease=false --latest
          fi
