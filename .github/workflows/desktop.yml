name: Desktop

# The desktop release train — independent from the core `v*` train.
#
# The core (Go binary + embedded SPA) ships on its own cadence via release.yml
# (`v*` → GoReleaser + signed R2 manifest). The desktop app is a thin Electron
# shell that BUNDLES a pinned, already-released core binary; it versions and
# ships on its own cadence here, so a shell-only change never forces a core
# release (and vice-versa — no "phantom" updates on either side).
#
# Cut a desktop release by pushing a `desktop-v*` tag:
#   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#
# The core version this build bundles is pinned in desktop/.core-version. Bump
# that file (+ cut a new desktop-v* tag) to ship a newer core to desktop users.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read # only needs to download the pinned core release archive

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # node + npm drive the Electron build / electron-builder. No Go or Bun:
      # this train never rebuilds the core or the SPA — it downloads the core
      # release the `v*` train already published.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read pinned core version
        shell: bash
        run: echo "CORE_VERSION=$(tr -d '[:space:]' < desktop/.core-version)" >> "$GITHUB_ENV"

      # Download the pinned core release's host-platform archive(s) and stage the
      # binary per-arch into desktop/resources/<arch> (electron-builder embeds the
      # matching slice via extraResources). This is the SAME binary CLI users run —
      # no rebuild, no drift. The shared script auto-detects the platform and, on
      # macOS, stages both the x64 and arm64 slices for the per-arch split. Fails
      # loudly if the release is missing.
      - name: Download & stage the pinned core binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_REPO: ${{ github.repository }}
        run: bash scripts/stage-core.sh "$CORE_VERSION" desktop/resources

      # electron-updater compares the app's package.json version against the feed.
      # Pin it to the desktop tag (drop the leading `desktop-v`) so updates resolve.
      - name: Sync desktop version to the tag
        shell: bash
        run: cd desktop && npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"

      - name: Install desktop deps
        # npm ci (not install): clean, lockfile-exact, faster in CI. The version
        # bump above updates package-lock.json too, so the two stay in sync.
        run: cd desktop && npm ci

      # Compile main/preload, then package for the host platform (macOS builds
      # both arches: dmg+zip for x64 and arm64). Build only (--publish never); the
      # R2 upload below is the publish step so the feed is a single, CDN-backed
      # source. macOS signs + notarizes; Windows signs via Azure Trusted Signing
      # when provisioned (falls back to unsigned otherwise); Linux is unsigned.
      # The generic feed URL is baked into app-update.yml / latest*.yml here from
      # DESKTOP_FEED_BASE (falls back to the electron-builder.yml default when unset).
      - name: Build & package
        shell: bash
        env:
          # macOS Developer ID cert (.p12) + notarization credentials.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DESKTOP_FEED_BASE: ${{ vars.DESKTOP_FEED_BASE }}
          # Windows Azure Trusted Signing. Non-secret account config as repo vars;
          # the service-principal auth as secrets. Signing is skipped (build stays
          # unsigned) unless WIN_AZURE_ENDPOINT is set — provisioning is external
          # and takes ~days, so this stays inert until then.
          WIN_AZURE_ENDPOINT: ${{ vars.WIN_AZURE_ENDPOINT }}
          WIN_AZURE_PUBLISHER_NAME: ${{ vars.WIN_AZURE_PUBLISHER_NAME }}
          WIN_AZURE_ACCOUNT: ${{ vars.WIN_AZURE_ACCOUNT }}
          WIN_AZURE_CERT_PROFILE: ${{ vars.WIN_AZURE_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cd desktop
          npm run build
          args=(--publish never)
          if [ -n "${DESKTOP_FEED_BASE:-}" ]; then
            args+=(-c.publish.url="${DESKTOP_FEED_BASE%/}/desktop")
          fi
          # Inject Azure Trusted Signing only on Windows and only when provisioned.
          if [ "${RUNNER_OS:-}" = "Windows" ] && [ -n "${WIN_AZURE_ENDPOINT:-}" ]; then
            # publisherName is a top-level win option; only endpoint/account/profile
            # belong under azureSignOptions (any extra key there is forwarded
            # verbatim to Invoke-TrustedSigning and would fail as an unknown param).
            args+=(
              -c.win.publisherName="${WIN_AZURE_PUBLISHER_NAME}"
              -c.win.azureSignOptions.endpoint="${WIN_AZURE_ENDPOINT}"
              -c.win.azureSignOptions.codeSigningAccountName="${WIN_AZURE_ACCOUNT}"
              -c.win.azureSignOptions.certificateProfileName="${WIN_AZURE_CERT_PROFILE}"
            )
          fi
          npx electron-builder "${args[@]}"

      # Publish INTO the desktop R2 feed (electron-updater reads it via the
      # generic provider). Symmetric with the core's R2 feed, and fully isolated
      # from the core `v*` GitHub Releases so the updater never mistakes a core
      # release for a desktop one. Each runner uploads only its own platform's
      # artifacts + latest*.yml, so the parallel matrix never collides.
      - name: Publish to the desktop R2 feed
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 historically rejected aws-cli v2's default integrity checksums;
          # only send them when an operation requires them.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          : "${R2_BUCKET:?R2_BUCKET must be set to the target bucket}"
          out=desktop/out
          # Fail loudly if electron-builder didn't emit update metadata: an empty
          # --include below would upload nothing and silently ship a feed with no
          # latest*.yml, breaking auto-update. (Each runner emits exactly one:
          # latest-mac.yml / latest.yml / latest-linux.yml.)
          ls "$out"/latest*.yml >/dev/null 2>&1 || {
            echo "::error::no latest*.yml in $out — electron-builder produced no update metadata; refusing to publish a broken feed" >&2
            exit 1
          }
          # Installers + blockmaps are version-named and immutable — cache forever.
          aws s3 cp "$out" "s3://${R2_BUCKET}/desktop/" --recursive \
            --exclude "*" \
            --include "*.dmg" --include "*.zip" --include "*.exe" \
            --include "*.AppImage" --include "*.deb" --include "*.rpm" --include "*.blockmap" \
            --cache-control "public, max-age=31536000, immutable"
          # Mutable objects (update metadata + the "latest" aliases below) share a
          # short TTL so a stale edge copy self-heals within ~5 min even without an
          # explicit cache purge.
          mut_cc="public, max-age=300, must-revalidate"
          aws s3 cp "$out" "s3://${R2_BUCKET}/desktop/" --recursive \
            --exclude "*" --include "latest*.yml" \
            --cache-control "$mut_cc"
          # Stable "latest" download aliases so the README can link a fixed URL.
          # Each runner only has its own platform's installer; nullglob skips the
          # globs that don't apply here. macOS is a per-arch split, so it gets one
          # alias per arch (arch-tagged artifactName from electron-builder.yml makes
          # the match unambiguous).
          shopt -s nullglob
          alias_latest() { for f in "$out"/$1; do aws s3 cp "$f" "s3://${R2_BUCKET}/desktop/$2" --cache-control "$mut_cc"; done; }
          alias_latest '*-arm64.dmg' PixivBiu-latest-macos-arm64.dmg
          alias_latest '*-x64.dmg'   PixivBiu-latest-macos-x64.dmg
          alias_latest '*.exe'       PixivBiu-latest-windows.exe
          alias_latest '*.AppImage'  PixivBiu-latest-linux.AppImage
