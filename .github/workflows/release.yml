name: Release

# Cross-compiles the self-contained binaries (frontend embedded) and publishes
# them as a GitHub Release — the source the app's self-updater reads. GoReleaser
# uploads the archives, checksums.txt, and its minisign signature
# (checksums.txt.minisig); official binaries carry the matching public key(s)
# and refuse a release whose checksums don't verify. Triggered by pushing a
# semver tag:
#   git tag v3.0.0 && git push origin v3.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload the archives + checksums

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can diff against the prior tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GoReleaser's `before` hook builds the frontend (cd frontend && bun ...),
      # so bun must be on PATH for the release run.
      - uses: oven-sh/setup-bun@v2

      # Pick the changelog base so each release aggregates everything since the
      # last release its channel could have received — not just since the prior
      # tag. GoReleaser otherwise diffs against the immediately-preceding tag, so
      # a stable cut right after a -beta/-alpha would have a near-empty changelog
      # (all the work was "eaten" by the pre-releases). We override
      # GORELEASER_PREVIOUS_TAG with the most recent ancestor tag a consumer of
      # this release would have already received: stable -> last stable, beta/rc
      # -> last beta/rc/stable, alpha -> last release. This mirrors the cumulative
      # channel model in internal/update/checker.go (releaseRank + channelFloor),
      # including DefaultChannel folding rc into the beta channel.
      - name: Compute previous tag for changelog
        shell: bash
        run: |
          cur="${GITHUB_REF_NAME}"
          # rank = a tag's true maturity, in sync with checker.go's releaseRank:
          # stable=3 / rc=2 / beta=1 / alpha=0 / non-semver or unknown suffix
          # (legacy v2.6.4a, -dev, …) = -1 so they are never used as a base.
          rank() {
            local t="$1"
            if   [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha(\.|$) ]]; then echo 0
            elif [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.|$)  ]]; then echo 1
            elif [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc(\.|$)    ]]; then echo 2
            elif [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$            ]]; then echo 3
            else echo -1
            fi
          }
          # floor = the channel floor of the *current* tag's audience: the lowest
          # maturity that audience accepts. rc has no channel of its own, so it
          # folds into beta (floor 1) like checker.go's channelFloor. A candidate
          # tag qualifies as the base iff its rank >= this floor (i.e. that
          # audience would already have it).
          floor() {
            local r; r="$(rank "$1")"
            case "$r" in
              2) echo 1 ;;   # rc -> beta channel floor
              *) echo "$r" ;;
            esac
          }
          fl="$(floor "$cur")"
          prev=""
          # Walk ancestor tags newest-first (semver order, prerelease-aware) and
          # take the first whose rank >= the current tag's channel floor.
          while read -r t; do
            [ "$t" = "$cur" ] && continue
            if [ "$(rank "$t")" -ge "$fl" ]; then prev="$t"; break; fi
          done < <(git -c versionsort.suffix=-alpha \
                       -c versionsort.suffix=-beta \
                       -c versionsort.suffix=-rc \
                       tag --list 'v*' --merged "${cur}^{commit}" --sort=-version:refname)
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
            echo "changelog base: $prev -> $cur"
          else
            echo "no qualifying previous tag; GoReleaser uses its default"
          fi

      # Validate and normalize the self-updater trust anchor BEFORE GoReleaser
      # publishes anything — its own guards would run too late. Two hazards:
      #  - GoReleaser creates a public, non-draft GitHub Release and stamps the
      #    binaries. A broken anchor here means shipping binaries that reject every
      #    future release and only failing afterwards, where a corrected rerun
      #    collides with the already-published release.
      #  - minisign public keys are base64 with no internal whitespace, but a fork
      #    might write "KEY1, KEY2". A space inside a `-X` ldflag value makes the Go
      #    linker treat the tail as a separate argument and the build fails, so we
      #    collapse any comma/whitespace runs to single commas — one safe token that
      #    is stamped into the binary AND matches the key that signs checksums.txt.
      # Downstream steps consume these normalized outputs, never the raw variables.
      # minisign (upstream jedisct1/minisign) verifies the key/secret pairing here
      # and signs checksums.txt inside GoReleaser (see `signs` in .goreleaser.yaml).
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Validate & normalize update trust anchor
        id: anchor
        env:
          PUBLIC_KEYS_IN: ${{ vars.UPDATE_PUBLIC_KEYS }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PUBLIC_KEYS_IN:?set the UPDATE_PUBLIC_KEYS repo variable to the trusted minisign public key(s)}"
          : "${MINISIGN_SECRET_KEY:?set the MINISIGN_SECRET_KEY secret to the release signing key}"

          # Collapse comma/whitespace runs to single commas: one token safe for -X.
          keys="$(printf '%s' "$PUBLIC_KEYS_IN" | tr -s '[:space:],' ',')"
          keys="${keys#,}"; keys="${keys%,}"
          [ -n "$keys" ] || { echo "UPDATE_PUBLIC_KEYS has no key content" >&2; exit 1; }
          # Each entry must have the minisign public-key shape (base64 "RW" + 54).
          IFS=',' read -ra _ks <<< "$keys"
          for k in "${_ks[@]}"; do
            [[ "$k" =~ ^RW[A-Za-z0-9+/]{54}$ ]] \
              || { echo "UPDATE_PUBLIC_KEYS entry is not a well-formed minisign public key: $k" >&2; exit 1; }
          done

          # Pairing: sign a probe with the secret and confirm it verifies under one of
          # the trusted keys. Catches a MINISIGN_SECRET_KEY that doesn't correspond to
          # UPDATE_PUBLIC_KEYS BEFORE GoReleaser publishes — otherwise we'd ship a
          # release whose signed checksums every official client rejects.
          key_file="${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          echo probe > probe.txt
          minisign -S -s "$key_file" -m probe.txt >/dev/null 2>&1 \
            || { echo "MINISIGN_SECRET_KEY is not a usable minisign secret key" >&2; exit 1; }
          paired=0
          for k in "${_ks[@]}"; do
            if minisign -Vm probe.txt -P "$k" >/dev/null 2>&1; then paired=1; break; fi
          done
          [ "$paired" = 1 ] \
            || { echo "MINISIGN_SECRET_KEY does not match any key in UPDATE_PUBLIC_KEYS (signer would be untrusted by clients)" >&2; exit 1; }
          rm -f probe.txt probe.txt.minisig

          # The key file stays for GoReleaser's `signs` step (checksums.txt),
          # referenced via MINISIGN_SECRET_KEY_FILE. RUNNER_TEMP is wiped after
          # the job; the secret never enters the workspace.
          echo "MINISIGN_SECRET_KEY_FILE=${key_file}" >> "$GITHUB_ENV"
          echo "public_keys=${keys}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The self-updater trust anchor, stamped into the binary via ldflags
          # (see .goreleaser.yaml). The same normalized value the pairing check
          # above proved matches the signing key, so the baked-in keys can't drift
          # from what signs the release. MINISIGN_SECRET_KEY_FILE (set by the
          # anchor step) feeds the `signs` block that produces checksums.txt.minisig.
          UPDATE_PUBLIC_KEYS: ${{ steps.anchor.outputs.public_keys }}

      # Belt & braces: confirm the published signature actually verifies under a
      # trusted key before declaring the release good. The pairing probe above
      # makes a failure here nearly impossible, but this checks the real artifact.
      - name: Verify checksums signature
        env:
          UPDATE_PUBLIC_KEYS: ${{ steps.anchor.outputs.public_keys }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra _ks <<< "$UPDATE_PUBLIC_KEYS"
          for k in "${_ks[@]}"; do
            if minisign -Vm dist/checksums.txt -x dist/checksums.txt.minisig -P "$k"; then
              exit 0
            fi
          done
          echo "checksums.txt.minisig does not verify under any trusted key" >&2
          exit 1
