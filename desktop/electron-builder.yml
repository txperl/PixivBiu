# electron-builder packaging for the PixivBiu desktop shell.
#
# The version is read from package.json — CI rewrites it to the release tag
# before packaging. The Go core binary is staged into ./resources by CI and
# embedded via extraResources; it is NOT bundled into the asar (see files).
appId: moe.tls.pixivbiu
productName: PixivBiu
copyright: Copyright © txperl

# Deterministic, arch-tagged artifact names. macOS ships a per-arch split (see
# mac.target), so every artifact must carry its arch to avoid collisions and to
# let the "latest" alias assets (.github/workflows/desktop.yml) match by arch.
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: out
  buildResources: build

# Default file set, minus things that don't belong inside app.asar. The Go
# binary ships through extraResources instead, so exclude it from the asar to
# avoid shipping it twice.
files:
  - "**/*"
  - "!resources/**"
  - "!src/**"
  - "!tsconfig.json"
  - "!electron-builder.yml"
  - "!**/*.map"
  - "!**/*.md"

# Stage the matching platform+arch binary (pixivbiu / pixivbiu.exe — lowercase,
# the core's release binary name) into the app's resources directory;
# core-process.ts resolves it from process.resourcesPath. `${arch}` selects the
# per-arch staging dir (resources/x64 or resources/arm64) that scripts/stage-core.sh
# populates, so each per-arch package embeds only its own core slice — no lipo.
extraResources:
  - from: resources/${arch}/
    to: .
    filter:
      - pixivbiu
      - pixivbiu.exe

# electron-updater reads its feed from a DEDICATED artifacts-only GitHub repo
# with plain vX.Y.Z tags. It cannot share this repo: the GitHub provider watches
# the newest release in the target repo, and the core's own `v*` releases (no
# latest*.yml) would shadow the desktop ones. This block is what app-update.yml —
# the updater's baked-in feed — is generated from, and where electron-builder
# publishes in CI (`--publish always`; releaseType keeps it a draft until the
# publish job in .github/workflows/desktop.yml verifies all platforms and flips
# it live). A fork points owner/repo at its own releases repo (and updates
# DESKTOP_REPO in the workflow to match).
publish:
  provider: github
  owner: txperl
  repo: PixivBiu-Desktop
  releaseType: draft

mac:
  category: public.app-category.entertainment
  # Hardened runtime + notarization (requires APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID and a Developer ID cert via CSC_LINK / CSC_KEY_PASSWORD).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Per-arch split (arm64 + x64) instead of a universal binary: a universal build
  # doubles the bundled 85 MB Go core (~171 MB fat) and ~doubles the Electron
  # runtime, so ~45% of a universal download is CPU code the user can't run.
  # Splitting halves per-user download/disk. Both arches build in one run on the
  # macos runner, producing a single latest-mac.yml that electron-updater filters
  # by process.arch. CI stages each core slice into resources/{x64,arm64}.
  target:
    - target: dmg
      arch: [x64, arm64]
    # zip is what electron-updater downloads for macOS auto-update.
    - target: zip
      arch: [x64, arm64]

win:
  # Signing: Azure Trusted Signing (cloud, EV-grade SmartScreen reputation, no
  # hardware token). Left OUT of this file so an unprovisioned build still
  # succeeds unsigned; CI injects it via `-c.win.azureSignOptions.*` from repo
  # vars only when WIN_AZURE_ENDPOINT is set (see .github/workflows/desktop.yml).
  # To sign locally instead, add here + set AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET.
  # publisherName is a top-level win option; azureSignOptions takes ONLY endpoint /
  # codeSigningAccountName / certificateProfileName (extra keys are forwarded
  # verbatim to Invoke-TrustedSigning and fail as unknown params):
  #   publisherName: <CN from your Trusted Signing cert profile>
  #   azureSignOptions:
  #     endpoint: https://<region>.codesigning.azure.net
  #     codeSigningAccountName: <trusted-signing-account>
  #     certificateProfileName: <cert-profile>
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Graphics
  # AppImage is the auto-updating format (electron-updater); deb + rpm are
  # install-only (managed by the system package manager). rpm covers
  # Fedora/RHEL/openSUSE — same x64 core, no extra infra (ubuntu runner has
  # rpmbuild via electron-builder's fpm).
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
